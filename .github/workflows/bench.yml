name: Benchmark

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bench-data
  cancel-in-progress: false

jobs:
  overhead:
    name: Measure overhead
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DHEAPLINE_ENABLE_BENCH=ON -DHEAPLINE_ENABLE_TESTS=OFF
          cmake --build build --parallel

      - name: Measure
        shell: bash
        run: |
          set -o pipefail
          lib=$PWD/build/libheapline.so
          churn=$PWD/build/bench/malloc_churn
          run() { sh bench/run_overhead.sh "$1" "$lib" 10 -- "${@:2}" | tee -a points.jsonl; }
          : >points.jsonl
          run churn-1t "$churn" 1 10000000
          run churn-4t "$churn" 4 10000000
          run resident-4t "$churn" 4 10000000 16 4096 512
          run large-4t "$churn" 4 2500000 65536 1048576
          run python python3 bench/python_churn.py

      - name: Append to bench-data
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          test "$(wc -l <points.jsonl)" -eq 5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin bench-data; then
            git worktree add data origin/bench-data
            git -C data switch -c bench-data
          else
            git worktree add --detach data
            git -C data switch --orphan bench-data
          fi
          cat points.jsonl >> data/history.jsonl
          python3 bench/check_regression.py data/history.jsonl
          git -C data add history.jsonl
          git -C data commit -m "bench: add ${GITHUB_SHA::7}"
          git -C data push origin bench-data
