name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate a comma locale
        run: sudo locale-gen fr_FR.UTF-8

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DHEAPLINE_ENABLE_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check code formatting
        run: clang-format-18 --dry-run --Werror $(git ls-files '*.cpp' '*.h')

  example:
    name: MPI example
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Open MPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DHEAPLINE_ENABLE_WERROR=ON -DHEAPLINE_ENABLE_EXAMPLES=ON
          cmake --build build --parallel

      - name: Run the example on 4 ranks
        run: |
          mkdir records
          mpirun --oversubscribe -n 4 env LD_PRELOAD=$PWD/build/libheapline.so \
            HEAPLINE_OUTPUT=$PWD/records/heapline.%h.%r.csv build/examples/mpi_imbalance

      - name: Summarize with heapline-report
        shell: bash
        run: |
          set -o pipefail
          build/heapline-report --csv merged.csv records | tee report.txt

      - name: Check the peaks
        run: sh tests/check_example.sh merged.csv 4

      - name: Run the plain tutorial
        shell: bash
        run: |
          set -o pipefail
          LD_PRELOAD=$PWD/build/libheapline.so python3 -c "x = [bytes(10**6) for i in range(300)]"
          LD_PRELOAD=$PWD/build/libheapline.so HEAPLINE_OUTPUT=run.csv python3 -c "x = [bytes(10**6) for i in range(300)]"
          cat run.csv
          build/heapline-report run.csv
          LD_PRELOAD=$PWD/build/libheapline.so HEAPLINE_OUTPUT=touched.csv python3 -c "x = [b'x' * 10**6 for i in range(300)]"
          build/heapline-report touched.csv
          # Step 4 of the tutorial: untouched zeroed blocks are not resident.
          # This depends on CPython and the kernel; if it flaps, relax the
          # factors or drop these two lines, the tutorial text stays true.
          awk -F, 'NR == 3 && $11 < $8 / 2 { ok = 1 } END { exit !ok }' run.csv
          awk -F, 'NR == 3 && $11 > 0.9 * $8 { ok = 1 } END { exit !ok }' touched.csv
          LD_PRELOAD=$PWD/build/libheapline.so HEAPLINE_OUTPUT=early.csv python3 -c "import time; x = bytes(300 * 10**6); del x; time.sleep(2)"
          LD_PRELOAD=$PWD/build/libheapline.so HEAPLINE_OUTPUT=late.csv python3 -c "import time; time.sleep(2); x = bytes(300 * 10**6)"
          build/heapline-report early.csv | grep '^  max' | grep 'at 0\.[0-4] s'
          build/heapline-report late.csv | grep '^  max' | grep 'at [12]\.[0-9] s'
          LD_PRELOAD=$PWD/build/libheapline.so HEAPLINE_OUTPUT=wrapped.csv bash -c "python3 -c \"x = [bytes(10**6) for i in range(300)]\"; echo done"
          awk -F, 'NR == 3 && $8 < 1048576 { found = 1 } END { exit !found }' wrapped.csv
