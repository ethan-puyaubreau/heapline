name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: [ Benchmark ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      - name: Check the performance page generator
        run: |
          python3 docs/perf_history.py tests/data/history-sample.jsonl
          test -s docs/_generated/performance-churn-4t.svg
          test -s docs/_generated/performance-python.svg

      - name: Render the performance history
        run: |
          git fetch origin bench-data || true
          git show origin/bench-data:history.jsonl > history.jsonl 2>/dev/null || rm -f history.jsonl
          rm -rf docs/_generated
          python3 docs/perf_history.py history.jsonl

      - name: Build
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
