name: Release

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  linux:
    name: Package Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          version=$(grep -oP 'project\(heapline VERSION \K[0-9.]+' CMakeLists.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHEAPLINE_ENABLE_WERROR=ON
          cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Package archive
        run: |
          name="heapline-v$VERSION-linux-x86_64"
          cmake --install build --prefix "$name"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" heapline-v*.tar.gz* \
            --title "heapline $GITHUB_REF_NAME" \
            --generate-notes
